name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 資材課版（フル機能）をサイトのルートにビルド
      - name: Build materials edition (root)
        run: npm run build
        env:
          NEXT_PUBLIC_REPO_NAME: ${{ github.event.repository.name }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Stage root output
        run: |
          mkdir -p site
          cp -a out/. site/
          touch site/.nojekyll

      # 閲覧専用版を /viewer/ サブパスにビルド
      - name: Build viewer edition (/viewer)
        run: npm run build:viewer
        env:
          NEXT_PUBLIC_REPO_NAME: ${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_SUBPATH: viewer
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Stage viewer output
        run: |
          mkdir -p site/viewer
          cp -a out/. site/viewer/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
